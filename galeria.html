<main class="gal">
  <header class="gal-head"><h1>Galería</h1><p>Lo que no cabe en una sola muestra: más trabajos y el archivo de la carrera de diseño.</p></header>
  <!-- carrusel a todo el ancho: el proyecto elegido al centro, tal cual (en su proporción, sin marco), y los demás a los lados (ver galeria.js) -->
  <section class="cf" aria-label="Proyectos" aria-roledescription="carrusel">
    <button class="cf-nav prev" id="cfPrev" type="button" aria-label="Proyecto anterior">‹</button>
    <div class="cf-stage" id="cf"></div>
    <button class="cf-nav next" id="cfNext" type="button" aria-label="Proyecto siguiente">›</button>
  </section>
  <!-- debajo: puntos (una por imagen), reproducir/pausa y sonido -->
  <div class="cf-ctl">
    <div class="cf-dots" id="cfDots" hidden></div>
    <button class="cf-btn" id="cfPlay" type="button" hidden></button>
    <button class="cf-btn" id="cfSnd" type="button" hidden></button>
  </div>
  <div class="cf-info" id="cfInfo" aria-live="polite"></div>
</main>

<dialog id="lb" aria-label="Imagen"><img alt=""><p></p><div class="lbn"><button id="pv">Anterior</button><button id="nx">Siguiente</button><span id="ct"></span><button id="cl">Cerrar</button></div></dialog>
